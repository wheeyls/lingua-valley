<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="width:100%;height:100%;display:block;">
  <!-- Wall — soft lilac, cozy kid's-room feel -->
  <rect width="400" height="190" fill="#EAD9EE"/>
  <!-- Wall stars (decorative) -->
  <g fill="#D9BEE0" opacity="0.6">
    <path d="M180,25 l3,7 7,1 -5,5 1,7 -6,-3.5 -6,3.5 1,-7 -5,-5 7,-1 z"/>
    <path d="M240,55 l2.5,5.5 6,0.8 -4.3,4.2 1,6 -5.2,-3 -5.2,3 1,-6 -4.3,-4.2 6,-0.8 z"/>
    <path d="M60,60 l2,4.5 5,0.6 -3.6,3.5 0.8,5 -4.2,-2.4 -4.2,2.4 0.8,-5 -3.6,-3.5 5,-0.6 z"/>
  </g>
  <!-- Baseboard -->
  <rect y="186" width="400" height="6" fill="#A5794F"/>
  <!-- Floor -->
  <rect y="192" width="400" height="48" fill="#C4956A"/>
  <!-- Floor planks -->
  <g stroke="#A0785A" stroke-width="1" opacity="0.45">
    <line x1="0" y1="208" x2="400" y2="208"/>
    <line x1="0" y1="224" x2="400" y2="224"/>
    <line x1="70" y1="192" x2="70" y2="240"/>
    <line x1="150" y1="192" x2="150" y2="240"/>
    <line x1="230" y1="192" x2="230" y2="240"/>
    <line x1="310" y1="192" x2="310" y2="240"/>
    <line x1="380" y1="192" x2="380" y2="240"/>
  </g>
  <!-- Round rug -->
  <ellipse cx="205" cy="214" rx="70" ry="14" fill="#E8956D" opacity="0.55"/>
  <ellipse cx="205" cy="214" rx="70" ry="14" fill="none" stroke="#C0392B" stroke-width="1.5" opacity="0.4"/>

  <!-- ===== Door (slot: door) ===== -->
  <g id="art-door">
    <rect x="12" y="32" width="106" height="158" rx="4" fill="#F3E9E0"/>
    <rect x="25" y="42" width="80" height="145" rx="3" fill="#8A5A44"/>
    <rect x="25" y="42" width="80" height="145" rx="3" fill="none" stroke="#6E4635" stroke-width="2"/>
    <circle cx="95" cy="116" r="3.5" fill="#F0C24B"/>
  </g>

  <!-- ===== Table (slot: table) ===== -->
  <g id="art-table">
    <rect x="163" y="150" width="8" height="38" rx="2" fill="#8A6244"/>
    <rect x="249" y="150" width="8" height="38" rx="2" fill="#8A6244"/>
    <ellipse cx="210" cy="150" rx="55" ry="13" fill="#B98253"/>
    <ellipse cx="210" cy="147" rx="55" ry="13" fill="#C99A6E"/>
  </g>

  <!-- ===== Shelf + vase (slot: vase) ===== -->
  <g id="art-vase">
    <rect x="255" y="90" width="130" height="7" rx="2" fill="#A5794F"/>
    <rect x="255" y="90" width="130" height="7" rx="2" fill="none" stroke="#7D5A3C" stroke-width="1"/>
    <path d="M310,90 L310,68 Q310,58 320,58 Q330,58 330,68 L330,90 Z" fill="#C0392B"/>
    <path d="M312,68 Q320,60 328,68" fill="none" stroke="#A93226" stroke-width="2" opacity="0.6"/>
    <ellipse cx="320" cy="52" rx="14" ry="9" fill="#27AE60"/>
    <ellipse cx="309" cy="56" rx="8" ry="6" fill="#2ECC71" transform="rotate(-20,309,56)"/>
    <ellipse cx="331" cy="56" rx="8" ry="6" fill="#2ECC71" transform="rotate(20,331,56)"/>
  </g>

  <!-- Window, purely decorative -->
  <rect x="150" y="18" width="80" height="60" rx="6" fill="#AED6F1" stroke="#7D5A3C" stroke-width="3"/>
  <line x1="190" y1="18" x2="190" y2="78" stroke="#7D5A3C" stroke-width="2"/>
  <line x1="150" y1="48" x2="230" y2="48" stroke="#7D5A3C" stroke-width="2"/>
  <rect x="153" y="21" width="34" height="24" rx="3" fill="white" opacity="0.25"/>
</svg>
